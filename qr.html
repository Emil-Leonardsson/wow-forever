<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Forever affisch</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --gold: #b8860b; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, "Segoe UI", sans-serif; background: #eee; color: #1a1408; }
    .tools { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .tools label { flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    .tools input { padding: 10px; font: inherit; border: 1px solid #999; border-radius: 6px; }
    .tools button { padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid #333; border-radius: 6px; background: #fff; }
    .poster {
      width: 210mm; min-height: 297mm; max-width: 100%; margin: 0 auto 32px; background: #fff;
      padding: 22mm 18mm; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8mm;
    }
    .poster .eyebrow { letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 0; }
    .poster h1 { font-family: Georgia, serif; font-size: 64pt; line-height: 1; margin: 0; }
    .poster h1 span { color: var(--gold); }
    .poster p { margin: 0; font-size: 16pt; max-width: 130mm; }
    #qr svg { width: 90mm; height: 90mm; display: block; }
    .cta { font-size: 22pt !important; font-weight: 700; }
    .url { font-size: 12pt !important; color: #555; word-break: break-all; }
    @media print {
      body { background: #fff; }
      .tools { display: none; }
      .poster { margin: 0; width: 100%; min-height: 100vh; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <label>Adress som QR-koden pekar på
      <input id="url" type="url" placeholder="https://...">
    </label>
    <button id="print">Skriv ut</button>
  </div>

  <main class="poster">
    <p class="eyebrow">Spelargrupp av Emil &amp; Cattis</p>
    <h1>WoW <span>Forever</span></h1>
    <p>Vi startar 4 november och vill spela med folk vi känner. Nybörjare och glesa speltider är välkomna.</p>
    <div id="qr" aria-label="QR-kod"></div>
    <p class="cta">Skanna och skriv upp din karaktär</p>
    <p class="url" id="urlText"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    const KEY = 'wf_qr_url';
    const input = document.getElementById('url');
    const fallback = new URL('index.html', location.href).href.replace(/index\.html$/, '');
    try { input.value = localStorage.getItem(KEY) || fallback; } catch { input.value = fallback; }

    function draw() {
      const url = input.value.trim();
      const box = document.getElementById('qr');
      document.getElementById('urlText').textContent = url;
      if (!url || typeof qrcode === 'undefined') { box.innerHTML = ''; return; }
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      try { localStorage.setItem(KEY, url); } catch { /* ignoreras */ }
    }
    input.addEventListener('input', draw);
    document.getElementById('print').addEventListener('click', () => window.print());
    draw();
  </script>
</body>
</html>
