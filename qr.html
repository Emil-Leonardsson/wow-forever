<!DOCTYPE html>
<html lang="sv" data-title-key="qrDocTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://emil-leonardsson.goatcounter.com; font-src 'self'; connect-src 'self' https://kpaolyovfybxedgaigvp.supabase.co https://emil-leonardsson.goatcounter.com; base-uri 'none'; form-action 'self'">
  <title>Dela WoW Forever-gruppen</title>
  <meta name="robots" content="noindex">
  <!-- Affischen ska alltid vara ljus och läsbar: stäng av automatiskt mörkt läge (Chrome/Samsung/Dark Reader). -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <link rel="icon" type="image/webp" href="assets/logo-color.webp">
  <script data-goatcounter="https://emil-leonardsson.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <style>
    :root { --gold: #9a6f0b; color-scheme: only light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, "Segoe UI", sans-serif; background: #ece7dc; color: #1a1408; }
    .tools { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .tools .row { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; }
    .tools a.back { color: #1a1408; font-weight: 600; text-decoration: none; }
    .tools label { flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    .tools input { padding: 10px; font: inherit; border: 1px solid #999; border-radius: 6px; background: #fff; }
    .tools button, .lang button { padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid #333; border-radius: 6px; background: #fff; }
    .right { display: flex; align-items: center; gap: 8px; }
    .tools .printbtn { padding: 6px 12px; font-size: .85rem; }
    .lang { display: inline-flex; }
    .lang button { padding: 6px 12px; border-radius: 0; font-size: .85rem; }
    .lang button:first-child { border-radius: 6px 0 0 6px; }
    .lang button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
    .lang button[aria-pressed="true"] { background: #1a1408; color: #fff; }
    [hidden] { display: none !important; }
    .poster {
      width: 210mm; min-height: 297mm; max-width: 100%; margin: 0 auto 32px; background: #fff;
      padding: 22mm 18mm; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8mm;
    }
    .poster .eyebrow { letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 0; }
    .poster .logo { width: 120mm; max-width: 100%; height: auto; }
    .poster p { margin: 0; font-size: 16pt; max-width: 130mm; }
    #qr { background: #fff; padding: 3mm; border-radius: 3mm; line-height: 0; }
    #qr svg { width: 80mm; height: 80mm; display: block; forced-color-adjust: none; filter: none; }
    .cta { font-size: 22pt !important; font-weight: 700; }
    .url { font-size: 12pt !important; color: #555; word-break: break-all; }
    @media (max-width: 700px) { .poster { padding: 16px; min-height: 0; } .cta { font-size: 18pt !important; } }
    @media print {
      html, body { margin: 0; padding: 0; background: #fff; height: auto; }
      .tools { display: none !important; }
      /* Exakt A4 (297 mm) minus en liten marginal, så att inget spiller över på en andra sida. */
      .poster { margin: 0; width: 210mm; height: 296mm; min-height: 0; max-width: none; padding: 18mm 16mm; overflow: hidden; break-after: avoid; page-break-after: avoid; break-inside: avoid; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <div class="row">
      <a class="back" href="./" data-i18n="qrBack">← Tillbaka till sidan</a>
      <div class="right">
        <button type="button" id="print" class="printbtn" data-i18n="qrPrint">Skriv ut</button>
        <div class="lang" role="group" data-i18n-aria="langLabel" aria-label="Språk">
          <button type="button" data-lang="sv" aria-pressed="true">SV</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </div>

  <main class="poster">
    <p class="eyebrow" data-i18n="eyebrow">Spelargrupp av Emil &amp; Cattis</p>
    <img class="logo" src="assets/logo-black.webp" alt="World of Warcraft Forever" width="1000" height="563">
    <p data-i18n="qrPitch">Vi startar 4 november och vill hitta lite folk att spela med. Hitta en spelgrupp som passar dig, eller skapa en egen.</p>
    <div id="qr" role="img" aria-label="QR"></div>
    <p class="cta" data-i18n="qrCta">Skanna och skriv upp din karaktär</p>
    <p class="url" id="urlText"></p>
  </main>

  <script src="i18n.js?v=24"></script>
  <script src="assets/qrcode.js"></script>
  <script src="qr.js"></script>
</body>
</html>
